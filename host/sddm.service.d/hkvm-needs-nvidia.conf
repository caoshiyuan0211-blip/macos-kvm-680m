# hackintosh-kvm: X is pinned to the RTX 5070 Ti (xorg.conf.d/20-nvidia-only.conf); without the dock
# sddm only fails 3x. Skip it; getty@tty1 (hkvm-headless.conf) starts the VM instead.
# Install: /etc/systemd/system/sddm.service.d/hkvm-needs-nvidia.conf
[Service]
ExecCondition=/bin/sh -c 'lspci -n -d 10de: | grep -q .'
