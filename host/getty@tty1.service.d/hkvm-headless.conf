# hackintosh-kvm: boot WITHOUT the USB4 RTX 5070 Ti dock -> no host GPU for X (amdgpu is blacklisted,
# the 680M goes to vfio) -> sddm can't start. Then tty1 logs YOUR_USER in and ~/.bash_profile starts
# the macOS VM headless (scripts/autostart-vm.sh). With the dock, tty1 stays off and sddm runs as usual.
# Install: /etc/systemd/system/getty@tty1.service.d/hkvm-headless.conf
[Service]
ExecCondition=/bin/sh -c '! lspci -n -d 10de: | grep -q .'
ExecStart=
ExecStart=-/sbin/agetty -o '-p -f -- \\u' --noclear --autologin YOUR_USER - $TERM
# QEMU pins all guest RAM for VFIO passthrough
LimitMEMLOCK=infinity
